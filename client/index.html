<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Mentor | Pro Edition</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Highlight.js or Prism for AI response -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- ... (Top Bar content) ... -->
        <header class="top-bar">
            <a href="/" class="logo">
                <img src="assets/favicon.png" alt="Logo" class="logo-icon">
                <span class="logo-text">AI Coding Mentor <span class="pro-tag">PRO</span></span>
            </a>
            <div class="top-controls">
                <div class="control-group">
                    <span class="label">LANGUAGE</span>
                    <select id="languageSelect" class="dropdown">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                    </select>
                </div>
                <div class="control-group">
                    <span class="label">LEVEL</span>
                    <select id="levelSelect" class="dropdown">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <button class="ready-btn">System Ready</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-container">
            <!-- Left Panel - Code Editor -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="icon"></span>
                        Source Editor
                        <span class="badge" id="langBadge">JS</span>
                    </div>
                    <div class="panel-buttons">
                        <button class="panel-btn" id="sampleBtn">Load Sample</button>
                        <button class="panel-btn" id="clearBtn">Clear</button>
                    </div>
                </div>
                <div class="editor-container" id="editorContainer">
                    <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
                </div>
            </div>

            <!-- Right Panel - AI Response -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="icon"></span>
                        AI Intelligence
                        <span class="badge-action" id="actionBadge"></span>
                    </div>
                    <div class="panel-buttons">
                        <button class="panel-btn icon-only" id="saveBtn" title="Save">Save</button>
                        <button class="panel-btn icon-only" id="copyBtn" title="Copy">Copy</button>
                    </div>
                </div>
                <div class="response-container">
                    <div id="output" class="output-area markdown-body"></div>
                    <div id="loading" class="loading-state hidden">
                        <div class="loader">
                            <div class="loader-inner"></div>
                        </div>
                        <p>Processing request...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="action-bar-wrapper">
            <div class="convert-popup hidden" id="convertPopup">
                <span class="convert-label">Target Language:</span>
                <select id="convertTarget" class="convert-select">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="typescript">TypeScript</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                </select>
                <button class="convert-go-btn" id="convertGoBtn">Execute Conversion</button>
            </div>
            <div class="action-bar">
                <button class="action-button blue" data-action="explain">Explain</button>
                <button class="action-button red" data-action="findBugs">Debug</button>
                <button class="action-button yellow" data-action="improve">Optimize</button>
                <button class="action-button teal" data-action="refactor">Refactor</button>
                <button class="action-button orange" id="convertBtn">Convert</button>
                <button class="action-button purple" data-action="bestPractices">Complexity</button>
                <button class="action-button green" data-action="generateTests">Tests</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
